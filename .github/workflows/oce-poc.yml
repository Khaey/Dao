name: DAO OCE synthetic PoC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oce-poc.yml'
      - 'scripts/oce-poc-sync.py'

permissions:
  contents: read

concurrency:
  group: dao-oce-synthetic-poc
  cancel-in-progress: false

jobs:
  poc:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate PoC runner
        run: python3 -m py_compile scripts/oce-poc-sync.py

      - name: Stage PoC runner on VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "scripts/oce-poc-sync.py"
          target: /opt/dao/ops-incoming/oce-poc-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 30s
          command_timeout: 2m

      - name: Run bounded synthetic PoC
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          timeout: 30s
          command_timeout: 7m
          script: |
            set -euo pipefail
            poc_dir='/opt/dao/ops-incoming/oce-poc-${{ github.run_id }}-${{ github.run_attempt }}'
            trap 'rm -rf "$poc_dir"' EXIT
            poc_script="$poc_dir/scripts/oce-poc-sync.py"
            test -f "$poc_script"
            chmod 0700 "$poc_script"
            "$poc_script"

      - name: Runner cleanup
        if: always()
        run: rm -f scripts/oce-poc-sync.py
