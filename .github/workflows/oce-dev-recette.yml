name: OCE DEV recette

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed OCE recette step on the synthetic DEV pair (credentials are never inputs)
        type: choice
        required: true
        default: probe
        options: [probe, provision, run, run-global, cleanup]

permissions:
  contents: read

concurrency:
  group: dao-dev-test-scope
  cancel-in-progress: false

jobs:
  recette:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: OCE recette on the fixed synthetic pair
        env:
          DAO_FIXTURE_TARGET: dev
          DAO_SUPABASE_URL: ${{ secrets.DAO_SUPABASE_URL }}
          DAO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAO_SUPABASE_PUBLISHABLE_KEY }}
          DAO_SUPABASE_SECRET_KEY: ${{ secrets.DAO_SUPABASE_SECRET_KEY }}
          DAO_TEST_CLIENT_EMAIL: ${{ secrets.DAO_TEST_CLIENT_EMAIL }}
          DAO_TEST_CLIENT_PASSWORD: ${{ secrets.DAO_TEST_CLIENT_PASSWORD }}
          DAO_TEST_CONTRACTOR_EMAIL: ${{ secrets.DAO_TEST_CONTRACTOR_EMAIL }}
          DAO_TEST_CONTRACTOR_PASSWORD: ${{ secrets.DAO_TEST_CONTRACTOR_PASSWORD }}
        run: node scripts/oce-dev-recette.mjs "${{ inputs.operation }}"
