name: D.A.O Architecture Pages

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dao-architecture-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and export Structurizr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Structurizr workspace
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/usr/local/structurizr"             structurizr/structurizr:2026.09.19-noble             validate -workspace docs/architecture/workspace.dsl

      - name: Export interactive static architecture site
        run: |
          rm -rf docs/architecture/static
          mkdir -p docs/architecture/static
          docker run --rm             -v "$GITHUB_WORKSPACE:/usr/local/structurizr"             structurizr/structurizr:2026.09.19-noble             export             -workspace docs/architecture/workspace.dsl             -format static             -output docs/architecture/static
          test -s docs/architecture/static/index.html
          touch docs/architecture/static/.nojekyll

      - name: Upload architecture preview
        uses: actions/upload-artifact@v4
        with:
          name: dao-architecture-static
          path: docs/architecture/static
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/architecture/static

  deploy:
    name: Publish architecture to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
