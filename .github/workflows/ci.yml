name: DAO CI and DEV deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dao-backend/package-lock.json
      - name: Initialize backend verification timing summary
        run: |
          {
            echo "### Backend verification timings"
            echo
            echo "| Stage | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Platform script checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          for script in scripts/*.sh ops/*.sh; do bash -n "$script"; done
      - name: Install backend dependencies
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Backend npm install" npm ci --no-audit --no-fund
      - name: Backend tests
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Backend tests" npm test
      - name: PGlite and local tests
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "PGlite and local tests" npm run test:local

  frontend-build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'dev' || 'ci-validation' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DAO_SUPABASE_URL || 'https://ci-validation.invalid' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DAO_SUPABASE_PUBLISHABLE_KEY || 'ci-validation-publishable-placeholder' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dao-frontend/package-lock.json
      - name: Initialize frontend build timing summary
        run: |
          {
            echo "### Frontend build timings"
            echo
            echo "| Stage | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache@v4
        with:
          path: dao-frontend/.next/cache
          key: dao-next-${{ runner.os }}-${{ hashFiles('dao-frontend/package-lock.json') }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'dev' || 'ci' }}-${{ hashFiles('dao-frontend/**', 'dao-backend/src/**') }}
          restore-keys: |
            dao-next-${{ runner.os }}-${{ hashFiles('dao-frontend/package-lock.json') }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'dev' || 'ci' }}-
      - name: Install backend runtime dependencies for Next.js API routes
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Backend runtime npm install" npm ci --omit=dev --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: dao-frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Frontend npm install" npm ci --no-audit --no-fund
      - name: Verify DEV build inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test "$NEXT_PUBLIC_SUPABASE_URL" != 'https://ci-validation.invalid'
          test "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" != 'ci-validation-publishable-placeholder'
      - name: Build frontend
        working-directory: dao-frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Frontend build for CI or DEV artifact" npm run build
      - name: Package frontend build and release script
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/dao-deploy-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Frontend deployment package validation" bash -euo pipefail -c '
            manifest="$RUNNER_TEMP/.dao-deploy-manifest.json"
            node ops/deploy-artifact-manifest.mjs create \
              "$manifest" \
              "$GITHUB_SHA" \
              dao-frontend/package-lock.json \
              dao-frontend/.next/BUILD_ID
            tar -czf "$1" \
              -C dao-frontend --exclude=.next/cache .next \
              -C "$RUNNER_TEMP" .dao-deploy-manifest.json \
              -C "$GITHUB_WORKSPACE" ops/deploy-dev.sh
            node ops/deploy-artifact-manifest.mjs verify \
              "$manifest" \
              "$GITHUB_SHA" \
              dao-frontend/package-lock.json \
              dao-frontend/.next/BUILD_ID
            if NEXT_PUBLIC_SUPABASE_URL='https://mismatch.invalid' NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY='mismatched-key' \
              node ops/deploy-artifact-manifest.mjs verify \
                "$manifest" \
                "$GITHUB_SHA" \
                dao-frontend/package-lock.json \
                dao-frontend/.next/BUILD_ID; then
              echo "Manifest accepted a different public Supabase configuration" >&2
              exit 1
            fi
            rm -f "$manifest"
          ' _ "$package_path"
          tar -tzf "$package_path" | tee "$RUNNER_TEMP/dao-deploy-package-files.txt"
          grep -Fxq '.next/BUILD_ID' "$RUNNER_TEMP/dao-deploy-package-files.txt"
          grep -Fxq '.dao-deploy-manifest.json' "$RUNNER_TEMP/dao-deploy-package-files.txt"
          grep -Fxq 'ops/deploy-dev.sh' "$RUNNER_TEMP/dao-deploy-package-files.txt"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            cp "$package_path" "$GITHUB_WORKSPACE/dao-deploy-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          fi
          ls -lh "$package_path"
      - name: Upload DEV frontend deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dao-deploy-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/dao-deploy-package-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  full-e2e:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Fresh schema, real Supabase integration, and FULL E2E
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
      DAO_E2E_STATE_DIR: /tmp/dao-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dao-frontend/package-lock.json
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1.6.1
        with:
          version: 2.118.0
      - name: Initialize complete validation timing summary
        run: |
          {
            echo "### Fresh schema, integration, and FULL E2E timings"
            echo
            echo "| Stage | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install backend dependencies for integration
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Backend npm install for integration" npm ci --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: dao-frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Frontend npm install for E2E" npm ci --no-audit --no-fund
      - name: Stop any previous local stack and start from a fresh database
        working-directory: dao-backend
        run: |
          supabase stop --no-backup || true
          bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Fresh Supabase start + migrations + seed" supabase start --exclude studio,edge-runtime,logflare,vector,supavisor,realtime,imgproxy,postgres-meta
      - name: Verify fresh migration ledger and schema contract
        working-directory: dao-backend
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Fresh migration list + schema contract" bash -euo pipefail -c '
            supabase migration list --local
            contract_sql="$(cat tests/schema-contract.sql)"
            supabase db query --local -o csv "$contract_sql"
          '
      - name: Capture fresh-local DAO schema fingerprints before reset
        working-directory: dao-backend
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Fresh-local schema fingerprint inventory" bash -euo pipefail -c '
            inventory_sql="$(sed "/^[[:space:]]*--/d" tests/schema-parity-inventory.sql)"
            raw_inventory="$RUNNER_TEMP/dao-schema-parity-fresh-local-raw.csv"
            final_inventory="$RUNNER_TEMP/dao-schema-parity-fresh-local.csv"
            supabase db query --local -o csv "$inventory_sql" > "$raw_inventory"
            node tests/schema-parity-inventory.mjs finalize "$raw_inventory" > "$final_inventory"
            test -s "$final_inventory"
            inventory_rows="$(tail -n +2 "$final_inventory" | wc -l | tr -d " ")"
            echo "Read-only DAO schema inventory: ${inventory_rows} objects" | tee -a "$GITHUB_STEP_SUMMARY"
            node tests/schema-parity-inventory.mjs summary "$final_inventory" | tee -a "$GITHUB_STEP_SUMMARY"
          '
      - name: Reset and replay all repository migrations and seed
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Supabase reset + complete migration replay + seed" supabase db reset --local
      - name: Verify reset migration ledger and schema contract
        working-directory: dao-backend
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Post-reset migration list + schema contract" bash -euo pipefail -c '
            supabase migration list --local
            contract_sql="$(cat tests/schema-contract.sql)"
            supabase db query --local -o csv "$contract_sql"
          '
      - name: Upload fresh-local DAO schema fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-schema-parity-fresh-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dao-schema-parity-fresh-local.csv
          if-no-files-found: ignore
      - name: Export disposable local Supabase credentials for integration and E2E
        working-directory: dao-backend
        shell: bash
        run: |
          status_env="$(supabase status -o env)"
          get_status_value() {
            local key="$1"
            local value
            value="$(printf '%s\n' "$status_env" | sed -n "s/^${key}=//p" | head -n 1)"
            value="${value#\"}"
            value="${value%\"}"
            if [ -z "$value" ]; then
              echo "Missing $key in local Supabase status" >&2
              return 1
            fi
            printf '%s' "$value"
          }
          api_url="$(get_status_value API_URL)"
          anon_key="$(get_status_value ANON_KEY)"
          service_role_key="$(get_status_value SERVICE_ROLE_KEY)"
          if [ "$api_url" != "http://127.0.0.1:54321" ]; then
            echo "Refusing validation target outside the disposable local Supabase stack" >&2
            exit 1
          fi
          echo "::add-mask::$service_role_key"
          {
            printf 'DAO_SUPABASE_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'DAO_SUPABASE_PUBLISHABLE_KEY=%s\n' "$anon_key"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$anon_key"
            printf 'DAO_SUPABASE_SECRET_KEY=%s\n' "$service_role_key"
          } >> "$GITHUB_ENV"
      - name: Run real Supabase integration tests against the replayed local stack
        working-directory: dao-backend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Real Supabase integration" npm run test:integration:real
      - name: Guard FULL E2E target
        working-directory: dao-frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "FULL E2E local-target guard" node tests/e2e/verify-supabase-target.mjs
      - name: Build E2E frontend and install Playwright browser in parallel
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dao-frontend
            bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Frontend E2E build with local Supabase config" npm run build
          ) &
          build_pid=$!

          (
            cd dao-frontend
            bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Playwright browser and system dependencies" npx playwright install --with-deps chromium
          ) &
          browser_pid=$!

          status=0
          wait "$build_pid" || status=1
          wait "$browser_pid" || status=1
          exit "$status"
      - name: Discover the expected 34 Playwright tests
        working-directory: dao-frontend
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "Playwright test discovery" bash -euo pipefail -c '
            npx playwright test --list | tee "$RUNNER_TEMP/playwright-test-discovery.txt"
          '
          grep -Eq 'Total: 34 tests in [0-9]+ files' "$RUNNER_TEMP/playwright-test-discovery.txt"
      - name: Run FULL Playwright E2E on desktop and mobile with configurable workers
        working-directory: dao-frontend
        run: bash "$GITHUB_WORKSPACE/.github/scripts/measure-ci-step.sh" "FULL Playwright execution (desktop + mobile, configured workers)" npm run test:e2e -- --reporter=line
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            dao-frontend/test-results
            dao-frontend/playwright-report
          if-no-files-found: ignore
      - name: Cleanup disposable E2E data
        if: always()
        working-directory: dao-frontend
        run: node tests/e2e/cleanup-e2e.mjs

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-verify, frontend-build, full-e2e]
    concurrency:
      group: dao-dev-operations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download the DEV-configured build artifact
        uses: actions/download-artifact@v4
        with:
          name: dao-deploy-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/dao-deploy-frontend
      - name: Prepare artifact for transfer
        run: cp "$RUNNER_TEMP/dao-deploy-frontend/dao-deploy-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" "$GITHUB_WORKSPACE/dao-deploy-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
      - name: Transfer verified build package to DEV host
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          source: dao-deploy-package-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          target: /opt/dao
          overwrite: true
          timeout: 30s
          command_timeout: 10m
      - name: Deploy verified revision over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            echo "DEPLOY_TIMING stage=ssh_connection_complete epoch_ms=$(date +%s%3N)"
            run_dir="/opt/dao/incoming/${{ github.run_id }}-${{ github.run_attempt }}"
            package="/opt/dao/dao-deploy-package-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
            payload="$run_dir/payload"
            test -s "$package"
            mkdir -p "$payload"
            if tar -tzf "$package" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "Deployment package contains an unsafe path" >&2
              exit 1
            fi
            started_ms="$(date +%s%3N)"
            tar -xzf "$package" -C "$payload" --no-same-owner --no-same-permissions
            finished_ms="$(date +%s%3N)"
            echo "DEPLOY_TIMING stage=payload_extract duration_ms=$((finished_ms - started_ms))"
            test -s "$payload/.dao-deploy-manifest.json"
            test -s "$payload/.next/BUILD_ID"
            test -f "$payload/ops/deploy-dev.sh"
            chmod 0750 "$payload/ops/deploy-dev.sh"
            bash "$payload/ops/deploy-dev.sh" "${{ github.sha }}" "${{ github.run_id }}" "${{ github.run_attempt }}" "$payload"
            rm -rf "$run_dir" "$package"

  ci-timing-summary:
    if: always()
    needs: [backend-verify, frontend-build, full-e2e, deploy-dev]
    name: CI timing summary
    runs-on: ubuntu-latest
    steps:
      - name: Report critical job and workflow durations
        shell: bash
        run: |
          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_data="$(curl --fail --silent --show-error --max-time 15 -H 'Accept: application/vnd.github+json' "$api_base/actions/runs/${GITHUB_RUN_ID}" || true)"
          jobs_data="$(curl --fail --silent --show-error --max-time 15 -H 'Accept: application/vnd.github+json' "$api_base/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" || true)"
          {
            echo "### Workflow timing"
            echo
            echo "| Measurement | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          run_started_at="$(printf '%s' "$run_data" | jq -r '.run_started_at // empty' 2>/dev/null || true)"
          if [ -n "$run_started_at" ]; then
            run_started_epoch="$(date -u -d "$run_started_at" +%s)"
            now_epoch="$(date -u +%s)"
            echo "| Workflow elapsed at final timing summary | $((now_epoch - run_started_epoch))s |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Workflow elapsed | unavailable (GitHub Actions API was not reachable) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$jobs_data" ]; then
            for job_name in "backend-verify" "frontend-build" "Fresh schema, real Supabase integration, and FULL E2E" "deploy-dev"; do
              job_times="$(printf '%s' "$jobs_data" | jq -r --arg name "$job_name" '.jobs[] | select(.name == $name and .conclusion != "skipped") | [.started_at // "", .completed_at // ""] | @tsv' | head -n 1)"
              [ -n "$job_times" ] || continue
              IFS=$'\t' read -r job_started_at job_completed_at <<< "$job_times"
              [ -n "$job_started_at" ] && [ -n "$job_completed_at" ] || continue
              job_started_epoch="$(date -u -d "$job_started_at" +%s)"
              job_completed_epoch="$(date -u -d "$job_completed_at" +%s)"
              echo "| Job: ${job_name} | $((job_completed_epoch - job_started_epoch))s |" >> "$GITHUB_STEP_SUMMARY"
            done

            for step_name in "Install pinned Supabase CLI" "Build E2E frontend and install Playwright browser in parallel"; do
              step_times="$(printf '%s' "$jobs_data" | jq -r --arg job "Fresh schema, real Supabase integration, and FULL E2E" --arg name "$step_name" '.jobs[] | select(.name == $job) | .steps[] | select(.name == $name and .conclusion != "skipped") | [.started_at // "", .completed_at // ""] | @tsv' | head -n 1)"
              [ -n "$step_times" ] || continue
              IFS=$'\t' read -r step_started_at step_completed_at <<< "$step_times"
              [ -n "$step_started_at" ] && [ -n "$step_completed_at" ] || continue
              step_started_epoch="$(date -u -d "$step_started_at" +%s)"
              step_completed_epoch="$(date -u -d "$step_completed_at" +%s)"
              echo "| ${step_name} | $((step_completed_epoch - step_started_epoch))s |" >> "$GITHUB_STEP_SUMMARY"
            done

            while IFS='|' read -r job_name step_name; do
              step_times="$(printf '%s' "$jobs_data" | jq -r --arg job "$job_name" --arg name "$step_name" '.jobs[] | select(.name == $job) | .steps[] | select(.name == $name and .conclusion != "skipped") | [.started_at // "", .completed_at // ""] | @tsv' | head -n 1)"
              [ -n "$step_times" ] || continue
              IFS=$'\t' read -r step_started_at step_completed_at <<< "$step_times"
              [ -n "$step_started_at" ] && [ -n "$step_completed_at" ] || continue
              step_started_epoch="$(date -u -d "$step_started_at" +%s)"
              step_completed_epoch="$(date -u -d "$step_completed_at" +%s)"
              echo "| ${job_name}: ${step_name} | $((step_completed_epoch - step_started_epoch))s |" >> "$GITHUB_STEP_SUMMARY"
            done <<'TIMED_STEPS'
            frontend-build|Install frontend dependencies
            frontend-build|Build frontend
            frontend-build|Package frontend build and release script
            deploy-dev|Download the DEV-configured build artifact
            deploy-dev|Transfer verified build package to DEV host
            deploy-dev|Deploy verified revision over SSH
          TIMED_STEPS
          fi
