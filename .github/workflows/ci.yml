name: DAO CI and DEV deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dao-backend/package-lock.json
            dao-frontend/package-lock.json
      - name: Backend install and tests
        working-directory: dao-backend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run test:local
      - name: Frontend install and build
        working-directory: dao-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  e2e-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    env:
      DAO_SUPABASE_URL: ${{ secrets.DAO_SUPABASE_URL }}
      DAO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAO_SUPABASE_PUBLISHABLE_KEY }}
      DAO_SUPABASE_SECRET_KEY: ${{ secrets.DAO_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DAO_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAO_SUPABASE_PUBLISHABLE_KEY }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DAO_E2E_STATE_FILE: /tmp/dao-e2e-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dao-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: dao-frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: dao-frontend
        run: npx playwright install --with-deps chromium
      - name: Provision disposable E2E users
        working-directory: dao-frontend
        run: node tests/e2e/provision-e2e.mjs
      - name: Run DEV Playwright flow
        working-directory: dao-frontend
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            dao-frontend/test-results
            dao-frontend/playwright-report
          if-no-files-found: ignore
      - name: Cleanup disposable E2E data
        if: always()
        working-directory: dao-frontend
        run: node tests/e2e/cleanup-e2e.mjs

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy verified revision over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            git -C /opt/dao/current fetch origin main
            git -C /opt/dao/current show ${{ github.sha }}:ops/deploy-dev.sh > /opt/dao/deploy-dev.sh
            chmod 0750 /opt/dao/deploy-dev.sh
            bash /opt/dao/deploy-dev.sh ${{ github.sha }}
