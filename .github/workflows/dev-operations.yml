name: DAO DEV operations

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: D.A.O DEV operation (never put credentials in inputs)
        type: choice
        required: true
        default: status
        options: [status, health, restart, env-sync, log-summary, diagnostics, ops-status, ops-preflight, ops-upgrade, ops-rollback, backup-status, oce-integration-inventory, oce-gateway-plan, oce-status, oce-audit, oce-probe, oce-start, oce-stop]

permissions:
  contents: read

jobs:
  operate:
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.actor == 'Khaey' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.action == 'created' && github.event.issue.number == 91 &&
            github.event.issue.pull_request == null &&
            contains(fromJSON('["/dao-ops status","/dao-ops health","/dao-ops restart","/dao-ops env-sync","/dao-ops log-summary","/dao-ops diagnostics","/dao-ops ops-status","/dao-ops ops-preflight","/dao-ops ops-upgrade","/dao-ops ops-rollback","/dao-ops backup-status","/dao-ops oce-integration-inventory","/dao-ops oce-gateway-plan","/dao-ops oce-status","/dao-ops oce-audit","/dao-ops oce-probe","/dao-ops oce-start","/dao-ops oce-stop"]'), github.event.comment.body))) }}
    concurrency:
      group: dao-dev-operations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and normalize owner operation
        id: request
        run: python3 scripts/dao-ops-request.py
      - name: Prepare private environment payload
        if: steps.request.outputs.operation == 'env-sync'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DAO_EMAIL_FROM: ${{ secrets.DAO_EMAIL_FROM }}
          DAO_PUBLIC_URL: https://dao-dev.logiclab.fr
        run: |
          umask 077
          python3 - <<'PY'
          import json, os
          if not os.environ.get('RESEND_API_KEY') or not os.environ.get('DAO_EMAIL_FROM'):
              raise SystemExit('Missing required dev environment secrets (values withheld)')
          with open('dao-env.json', 'w') as f:
              json.dump({k: os.environ[k] for k in ('RESEND_API_KEY', 'DAO_EMAIL_FROM', 'DAO_PUBLIC_URL')}, f)
          PY
          # scp-action runs in a container and needs read access to the
          # ephemeral source file. The file is removed immediately after copy.
          chmod 0644 dao-env.json
      - name: Transfer private payload
        if: steps.request.outputs.operation == 'env-sync'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          source: dao-env.json
          target: /opt/dao/ops-incoming/${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 30s
          command_timeout: 2m
      - name: Remove runner payload after transfer
        if: always() && steps.request.outputs.operation == 'env-sync'
        run: rm -f dao-env.json
      - name: Execute fixed DEV operation
        uses: appleboy/ssh-action@v1.2.2
        env:
          DAO_OPERATION: ${{ steps.request.outputs.operation }}
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: DAO_OPERATION
          timeout: 30s
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/dao/current
            bash scripts/dao-operations.sh "$DAO_OPERATION" '${{ github.run_id }}' '${{ github.run_attempt }}'
      - name: Remove runner payload
        if: always()
        run: rm -f dao-env.json
      - name: Remove host private payload after an interrupted operation
        if: always() && steps.request.outputs.operation == 'env-sync'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          timeout: 30s
          command_timeout: 30s
          script: |
            rm -rf -- '/opt/dao/ops-incoming/${{ github.run_id }}-${{ github.run_attempt }}'
