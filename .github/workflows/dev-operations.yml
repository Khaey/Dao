name: DAO DEV operations

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      operation:
        description: D.A.O DEV operation (never put credentials in inputs)
        type: choice
        required: true
        default: status
        options: [status, health, restart, env-sync, log-summary, diagnostics, ops-status, ops-preflight, ops-upgrade, ops-rollback, backup-status, oce-integration-inventory, oce-gateway-plan, oce-gateway-apply, oce-gateway-qualify, oce-gateway-restart, oce-enable-dev, oce-disable-dev, oce-recette-admit, oce-recette-revoke, oce-status, oce-audit, oce-probe, oce-start, oce-stop, perf-snapshot]

permissions:
  contents: read

jobs:
  operate:
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.actor == 'Khaey' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.action == 'created' && github.event.issue.number == 91 &&
            github.event.issue.pull_request == null &&
            contains(fromJSON('["/dao-ops status","/dao-ops health","/dao-ops restart","/dao-ops env-sync","/dao-ops log-summary","/dao-ops diagnostics","/dao-ops ops-status","/dao-ops ops-preflight","/dao-ops ops-upgrade","/dao-ops ops-rollback","/dao-ops backup-status","/dao-ops oce-integration-inventory","/dao-ops oce-gateway-plan","/dao-ops oce-gateway-apply","/dao-ops oce-gateway-qualify","/dao-ops oce-gateway-restart","/dao-ops oce-enable-dev","/dao-ops oce-disable-dev","/dao-ops oce-recette-admit","/dao-ops oce-recette-revoke","/dao-ops oce-status","/dao-ops oce-audit","/dao-ops oce-probe","/dao-ops oce-start","/dao-ops oce-stop","/dao-ops perf-snapshot"]'), github.event.comment.body))) }}
    concurrency:
      group: dao-dev-operations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and normalize owner operation
        id: request
        run: python3 scripts/dao-ops-request.py
      - name: Prepare pinned native SSH
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_HOST_FINGERPRINT: ${{ secrets.DEV_SSH_HOST_FINGERPRINT }}
        run: bash scripts/prepare-dev-ssh.sh
      - name: Prepare private environment payload
        if: steps.request.outputs.operation == 'env-sync'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DAO_EMAIL_FROM: ${{ secrets.DAO_EMAIL_FROM }}
          DAO_PUBLIC_URL: https://dao-dev.logiclab.fr
        run: |
          umask 077
          python3 - <<'PY'
          import json, os
          if not os.environ.get('RESEND_API_KEY') or not os.environ.get('DAO_EMAIL_FROM'):
              raise SystemExit('Missing required dev environment secrets (values withheld)')
          with open('dao-env.json', 'w') as f:
              json.dump({k: os.environ[k] for k in ('RESEND_API_KEY', 'DAO_EMAIL_FROM', 'DAO_PUBLIC_URL')}, f)
          PY
      - name: Stage fixed non-root operations transport
        run: bash scripts/prepare-ops-transport.sh '${{ github.run_id }}' '${{ github.run_attempt }}'
      - name: Transfer fixed operations transport
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/dao-secure-ssh/config"
          target="/opt/dao/ops-incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -F "$cfg" dao-dev "bash -se -- '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" < scripts/stage-dev-private-dir.sh
          tar -czf - -C "ops-incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" . |
            ssh -F "$cfg" dao-dev "umask 077; tar -xzf - -C '$target' --no-same-owner --no-same-permissions"
          ssh -F "$cfg" dao-dev "test \"\$(stat -c %a '$target')\" = 700 && if test -e '$target/dao-env.json'; then test \"\$(stat -c %a '$target/dao-env.json')\" = 600; fi"
      - name: Remove runner transport after transfer
        if: always()
        run: |
          rm -f dao-env.json
          rm -rf -- 'ops-incoming/${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Execute fixed DEV operation
        env:
          DAO_OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          # The request parser supplies a closed vocabulary; reject shell syntax too.
          [[ "$DAO_OPERATION" =~ ^[a-z-]+$ ]] || exit 2
          max_time=5m
          if [[ "$DAO_OPERATION" == oce-gateway-apply ]]; then max_time=17m; fi
          timeout "$max_time" ssh -F "$RUNNER_TEMP/dao-secure-ssh/config" dao-dev "bash '/opt/dao/ops-incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/scripts/dao-operations.sh' '$DAO_OPERATION' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'"
      - name: Remove runner payload
        if: always()
        run: |
          rm -f dao-env.json
          rm -rf -- 'ops-incoming/${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Remove host transport after operation or interruption
        if: always()
        continue-on-error: true
        run: |
          cfg="$RUNNER_TEMP/dao-secure-ssh/config"
          if [[ -f "$cfg" ]]; then
            timeout 30s ssh -F "$cfg" dao-dev "rm -rf -- '/opt/dao/ops-incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"
          fi
      - name: Remove runner SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/dao-secure-ssh"
