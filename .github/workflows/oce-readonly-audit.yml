name: DAO OCE read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oce-readonly-audit.yml'
      - 'scripts/oce-readonly-audit.sh'

permissions:
  contents: read

concurrency:
  group: dao-oce-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate audit helper
        run: bash -n scripts/oce-readonly-audit.sh

      - name: Stage audit helper on VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          source: scripts/oce-readonly-audit.sh
          target: /opt/dao/ops-incoming/oce-audit-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 30s
          command_timeout: 2m

      - name: Run sanitized read-only OCE audit
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 137.74.168.122
          username: dao
          key: ${{ secrets.DEV_SSH_KEY }}
          timeout: 30s
          command_timeout: 7m
          script: |
            set -euo pipefail
            audit_dir='/opt/dao/ops-incoming/oce-audit-${{ github.run_id }}-${{ github.run_attempt }}'
            trap 'rm -rf "$audit_dir"' EXIT
            audit_script="$audit_dir/scripts/oce-readonly-audit.sh"
            test -f "$audit_script"
            chmod 0700 "$audit_script"
            "$audit_script"

      - name: Runner cleanup
        if: always()
        run: rm -f scripts/oce-readonly-audit.sh
